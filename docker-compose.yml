services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: southboy
      POSTGRES_DB: paynest_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U southboy -d paynest_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
